name: V3.210 Universal Builder Intelligence and Shared Capabilities
on:
  push:
    branches: [v3.210]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app-intelligence-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Staging preflight, no-network rehearsal and previous builder contracts
        run: |
          node scripts/check-builders-v3210.mjs
          node scripts/check-builders-v3209.mjs
          node scripts/check-reviewed-owner-send-v3208.mjs
          node scripts/check-fresh-followups-v3207.mjs
          node scripts/check-owner-followups-v3206.mjs
          node scripts/check-communications-v3205.mjs
          node scripts/check-customer-journey-v3204.mjs
          node scripts/check-message-integrity-v3185.mjs
          node scripts/check-staging-v3203.mjs
          node scripts/check-staging-v3202.mjs
          node scripts/check-staging-verification-v3201.mjs
          node scripts/check-major-builders-v3200.mjs
          node scripts/check-major-builders-v3199.mjs
          node scripts/check-major-builders-v3198.mjs
          node scripts/check-major-builders-v3197.mjs
          node scripts/check-major-builders-v3196.mjs
          node scripts/check-major-builders-v3195.mjs
          node scripts/audit-architecture-v3195.mjs
          node scripts/check-major-builders-v3194.mjs
          node scripts/check-major-builders-v3193.mjs
          node scripts/check-major-builders-v3192.mjs
          node scripts/check-major-builders-v3191.mjs
          node scripts/check-builders-v3190.mjs
          node scripts/check-app-customer-tasks-v3169.mjs
          node scripts/check-native-public-booking-v3155.mjs
          node scripts/check-standalone-native-v3154.mjs
          node scripts/check-website-direct-edit-v3133.mjs
          node scripts/check-website-pages-v3135.mjs
          node scripts/check-website-completion-integrity-v3152.mjs
          node scripts/check-builder-handoff-v3152.mjs
          node scripts/check-connected-readiness-v3189.mjs
          node scripts/prepare-staging-install-v3180.mjs
          node scripts/verify-staging-install-v3186.mjs
          node scripts/audit-staging-install-v3202.mjs
          node scripts/audit-staging-risks-v3203.mjs
          node scripts/check-evidence-readiness-v3188.mjs
          node scripts/check-production.mjs
      - name: Install pinned Expo dependencies
        run: npm install --no-audit --no-fund
      - name: Parse iOS Android and edge source
        run: node scripts/check-app-native-syntax-v3154.mjs
      - name: Export Busy iOS and Android JS
        run: |
          npx expo export --platform ios --output-dir /tmp/bdi-v3210-ios
          npx expo export --platform android --output-dir /tmp/bdi-v3210-android
      - name: Export standalone iOS and Android JS
        run: |
          node scripts/prepare-standalone-prototype-v3154.mjs
          cd .tmp/standalone-prototype-v3154
          ../../node_modules/.bin/expo export --platform ios --output-dir /tmp/bdi-v3210-standalone-ios
          ../../node_modules/.bin/expo export --platform android --output-dir /tmp/bdi-v3210-standalone-android
      - name: Note limits
        run: echo "V3.209 is source and offline checks only; no database, Edge deploy, paid provider, signed binary, store submission or real customer traffic."
