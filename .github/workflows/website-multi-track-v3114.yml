name: V3.114 Multi-track website quality and domain safety
on:
  push:
    branches: [v3.114]
    paths:
      - 'src/core/websiteCustomerJourney.mjs'
      - 'src/core/websiteDomainResponsibilities.mjs'
      - 'src/core/websiteDomainShopping.mjs'
      - 'src/screens/websiteBuilder.js'
      - 'src/screens/websitePublishing.js'
      - 'supabase/functions/busy-website-worker/websiteReviewCycle.mjs'
      - 'scripts/check-website-multi-track-v3114.mjs'
      - 'scripts/check-website-private-alternatives-v3113.mjs'
      - 'scripts/check-website-guided-alternative-v3113.mjs'
      - '.github/workflows/website-multi-track-v3114.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website-and-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Check four independent tracks plus previous suites
        run: |
          node scripts/check-website-multi-track-v3114.mjs
          node scripts/check-website-private-alternatives-v3113.mjs
          node scripts/check-website-registrar-gateway-v3112.mjs
          node scripts/check-website-domain-shopping-v3111.mjs
          node scripts/check-website-visual-improvements-v3106.mjs
      - run: npm install --no-audit --no-fund
      - name: Compile actual iOS JavaScript; do not make a native build
        run: npx expo export --platform ios --output-dir /tmp/busy-v3114-ios-js
      - run: npx playwright install --with-deps chromium
      - name: Generate original and different private website candidates
        run: node scripts/build-website-design-gallery-v3100.mjs /tmp/busy-v3114-gallery
      - name: Check quality of a before-and-after private design
        run: node scripts/check-website-guided-alternative-v3113.mjs /tmp/busy-v3114-gallery /tmp/busy-v3114-before-after
      - name: Check different industries truly render differently
        run: node scripts/check-website-rendered-diversity-v3112.mjs /tmp/busy-v3114-gallery /tmp/busy-v3114-design-diversity
      - name: Verify all mobile/desktop layouts and keyboard interaction
        run: |
          node scripts/check-website-responsive-quality-v3109.mjs /tmp/busy-v3114-gallery /tmp/busy-v3114-responsive
          node scripts/check-website-keyboard-quality-v3110.mjs /tmp/busy-v3114-gallery /tmp/busy-v3114-keyboard
      - name: Upload noncustomer browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: v3114-multitrack-fictional-site-evidence
          path: |
            /tmp/busy-v3114-before-after/
            /tmp/busy-v3114-design-diversity/
            /tmp/busy-v3114-responsive/
            /tmp/busy-v3114-keyboard/
          retention-days: 7
      - run: echo "No live domains, new provider, paid vision, EAS signed build or production Supabase deployment."
