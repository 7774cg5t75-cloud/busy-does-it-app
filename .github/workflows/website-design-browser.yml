name: Premium Website original-renderer browser evidence
on:
  push:
    branches: [codex/builder-mission15-design-advancement]
    paths:
      - 'supabase/functions/busy-website-worker/**'
      - 'src/domain/websiteBuilder.js'
      - 'src/core/premiumWebsite*.mjs'
      - 'src/core/guidedWebsiteJourney.mjs'
      - 'src/core/websitePhotoReview.mjs'
      - 'src/screens/guidedWebsiteCreation.js'
      - 'scripts/check-guided-website-creation.mjs'
      - 'scripts/fetch-guided-website-assets.py'
      - 'scripts/fixtures/guided-websites/**'
      - 'scripts/check-website-design-expansion.mjs'
      - 'scripts/capture-website-design.mjs'
      - 'scripts/fetch-website-test-assets.py'
      - 'scripts/fixtures/website-design/**'
      - '.github/workflows/website-design-browser.yml'
permissions:
  contents: read
concurrency:
  group: premium-website-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fictional-renderer:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Reviewed installation without package lifecycle scripts
        run: |
          npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/apply-tooling-security-patches.mjs
          node scripts/check-dependency-security.mjs
          python3 scripts/testing/bootstrap.py --allow-network
      - name: Original renderer and pinned CC0 demonstration assets
        run: |
          node scripts/check-website-design-expansion.mjs
          python3 scripts/fetch-website-test-assets.py
          node scripts/check-guided-website-creation.mjs
          python3 scripts/fetch-guided-website-assets.py
      - name: Install browser from existing exact Playwright dependency
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: Capture with required Chromium sandbox and no external browser requests
        run: |
          node scripts/capture-website-design.mjs
          BUSY_GUIDED_BROWSER=1 node scripts/capture-website-design.mjs
      - name: Retain synthetic HTML, original pixels and exact provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: premium-website-browser-${{ github.sha }}
          path: |
            .test-artifacts/website-expansion/
            .test-artifacts/guided-websites/
          retention-days: 7
          if-no-files-found: error
  prior-pixel-review:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    steps:
      - name: Retrieve exact prior original-renderer evidence without regeneration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41618490517 --repo 7774cg5t75-cloud/busy-does-it-app --name premium-website-browser-4de05a9c51c507f155e40708b4aa772c76025bf1 --dir prior-pixels
          python3 - <<'PY'
          import pathlib,json,hashlib
          base=pathlib.Path('prior-pixels')
          for folder in ['guided-websites','website-expansion']:
              root=base/folder
              data=json.loads((root/'browser-results.json').read_text())
              assert data['source']['commit']=='4de05a9c51c507f155e40708b4aa772c76025bf1'
              assert data['source']['tree']=='7937b372be35ae9c4d8dfa5422ff5549b75feb4a'
              for row in data['results']:
                  assert pathlib.Path(row['filename']).name==row['filename']
                  assert hashlib.sha256((root/row['filename']).read_bytes()).hexdigest()==row['sha256']
              print(folder,len(data['results']),'original pixel hashes verified',data['browser'])
          PY
      - name: Retain exact guided pixels in a transfer-sized archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prior-guided-pixels-4de05a9c
          path: |
            prior-pixels/guided-websites/*.png
            prior-pixels/guided-websites/browser-results.json
          retention-days: 7
          if-no-files-found: error
      - name: Retain exact expansion pixels without repeated source-photo files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prior-expansion-pixels-4de05a9c
          path: |
            prior-pixels/website-expansion/*.png
            prior-pixels/website-expansion/browser-results.json
          retention-days: 7
          if-no-files-found: error
