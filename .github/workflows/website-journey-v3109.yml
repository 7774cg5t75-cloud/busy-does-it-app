name: V3.109 simple websites and read-only DNS checks
on:
  push:
    branches: [v3.109]
    paths:
      - 'scripts/check-website-journey-v3109.mjs'
      - 'scripts/check-website-responsive-quality-v3109.mjs'
      - 'src/screens/websitePublishing.js'
      - 'src/app/AppController.js'
      - 'supabase/functions/busy-website-publish/**'
      - '.github/workflows/website-journey-v3109.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Verify DNS diagnosis, identity and permission boundaries
        run: node scripts/check-website-journey-v3109.mjs
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Render distinct fictional businesses without cloud hosting
        run: node scripts/build-website-design-gallery-v3100.mjs /tmp/busy-v3109-gallery
      - name: Test smallest phones through desktop at five real viewports
        run: node scripts/check-website-responsive-quality-v3109.mjs /tmp/busy-v3109-gallery /tmp/busy-v3109-evidence
      - name: Preserve only fictional screenshots and browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: v3109-responsive-professional-websites
          path: /tmp/busy-v3109-evidence/
          retention-days: 7
      - run: echo "No paid AI, EAS release, Cloudflare provisioning, live DNS changes or customer publishing."
