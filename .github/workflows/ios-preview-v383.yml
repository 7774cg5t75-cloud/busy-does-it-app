name: V3.83 iPhone preview build

on:
  push:
    branches:
      - v3.83
    paths:
      - .github/workflows/ios-preview-v383.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-ios-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: "1"
    steps:
      - name: Check out V3.83
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Verify expected app and signing configuration
        run: |
          node -e "const p=require('./package.json'),a=require('./app.json').expo; if (p.version!=='3.83.0'||a.version!=='3.83.0'||a.ios.bundleIdentifier!=='com.busydoesit.app'||!a.extra?.eas?.projectId) process.exit(1)"

      - name: Verify Expo authorization
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not configured in GitHub. No build has started; use an Expo token as a GitHub Actions secret or launch from your already logged-in Codespace."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Queue signed iOS preview build (registered devices)
        run: npx --yes eas-cli@latest build --platform ios --profile preview --non-interactive --no-wait
