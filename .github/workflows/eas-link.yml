name: Link EAS project

on:
  push:
    branches:
      - v3.26
    paths-ignore:
      - SNACK_PREVIEW.json
  workflow_dispatch:
    inputs:
      approval_phrase:
        description: "Explicit approval for this legacy external/source operation"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: eas-link-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link:
    if: github.event_name == 'workflow_dispatch' && inputs.approval_phrase == 'APPROVE_EAS_PROJECT_LINK' && vars.BUSY_LEGACY_TOOLCHAIN_REVIEWED == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified upstream commit
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 verified upstream commit
        with:
          node-version: 22.13.0

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Link EAS project when Expo token exists
        id: link
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if node -e "const a=require('./app.json').expo;if(!a.extra?.eas?.projectId)process.exit(1)"; then
            echo "EAS project is already linked."
            echo "linked=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not configured; leaving the EAS project link as the remaining account-bound step."
            echo "linked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx --yes eas-cli@latest init --non-interactive --force
          echo "linked=true" >> "$GITHUB_OUTPUT"

      - name: Commit generated EAS project ID
        if: steps.link.outputs.linked == 'true'
        run: |
          if git diff --quiet -- app.json; then
            echo "app.json already contains the EAS project link."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          git commit -m "Link BUSY to EAS project [skip ci]"
          # A moved branch is a reconciliation boundary, never an automatic rebase.
          test "$(git ls-remote origin refs/heads/"${GITHUB_REF_NAME}" | cut -f1)" = "$(git rev-parse HEAD^)"
          git push
