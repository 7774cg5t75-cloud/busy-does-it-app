name: V3.180 Transactional Staging and Connected Intelligence
on:
  push:
    branches: [v3.180]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-postgres-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_disposable_only_v3180
          POSTGRES_DB: busy_v3180_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d busy_v3180_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install disposable PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Exercise atomic rollback and tenant restrictions in PostgreSQL 17
        env:
          PGPASSWORD: ci_disposable_only_v3180
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 5432 \
            -U postgres -d busy_v3180_ci \
            -f staging/ci-atomic-handoff-v3180.sql

  source-tests-and-native-exports:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: New transactional and intelligence source tests
        run: |
          node scripts/check-atomic-staging-v3180.mjs
          node scripts/prepare-staging-install-v3180.mjs
          node scripts/check-operational-readiness-v3179.mjs
          node scripts/check-release-readiness-v3178.mjs
          node scripts/check-verified-outcomes-v3177.mjs
          node scripts/check-authenticated-brain-staging-v3176.mjs
          node scripts/check-business-brain-staging-v3175.mjs
          node scripts/check-shared-customer-journeys-v3172.mjs
          node scripts/check-native-public-booking-v3155.mjs
          node scripts/check-standalone-native-v3154.mjs
          node scripts/check-production.mjs
      - name: Install pinned Expo dependencies
        run: npm install --no-audit --no-fund
      - name: Parse source and Edge import graph
        run: node scripts/check-app-native-syntax-v3154.mjs
      - name: Export Busy for iOS and Android
        run: |
          npx expo export --platform ios --output-dir /tmp/bdi-v3180-ios
          npx expo export --platform android --output-dir /tmp/bdi-v3180-android
      - name: Independent standalone iOS/Android export
        run: |
          node scripts/prepare-standalone-prototype-v3154.mjs
          cd .tmp/standalone-prototype-v3154
          ../../node_modules/.bin/expo export --platform ios --output-dir /tmp/bdi-v3180-standalone-ios
          ../../node_modules/.bin/expo export --platform android --output-dir /tmp/bdi-v3180-standalone-android
      - name: Explicit real-world proof boundary
        run: echo "No hosted staging deployment, genuine Supabase JWT, external diary/provider delivery, real device install or production change."
