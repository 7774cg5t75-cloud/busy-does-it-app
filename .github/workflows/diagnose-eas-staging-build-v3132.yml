name: Diagnose existing failed Expo staging build (read-only)
on:
  push:
    branches: [v3.132]
    paths:
      - '.github/workflows/diagnose-eas-staging-build-v3132.yml'
      - 'scripts/diagnose-eas-staging-build-v3132.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-failed-build:
    environment: isolated-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install project dependencies to resolve Expo plugins for read-only metadata
        run: npm install --no-audit --no-fund
      - name: Read-only existing EAS build metadata (never start another build)
        run: |
          test -n "$EXPO_TOKEN" || (echo "Missing protected token" && exit 3)
          set +e
          npx --yes eas-cli@latest build:view 9a441a9b-a0c2-4cce-995c-2dfbc3e82564 --json > "$RUNNER_TEMP/failed-build.json" 2>"$RUNNER_TEMP/failed-view-stderr.txt"
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            node -e 'const fs=require("fs"); for(const file of process.argv.slice(1)){const s=fs.readFileSync(file,"utf8").replace(/https?:\/\/\S+/g,"[URL redacted]").replace(/sb_(secret|publishable)_[\w-]+/g,"[key redacted]").replace(/(eyJ[\w-]+\.){2}[\w-]+/g,"[JWT redacted]"); console.log(file.includes("stderr")?"CLI stderr (sanitized):":"CLI stdout (sanitized):",s.slice(-1600));}' "$RUNNER_TEMP/failed-build.json" "$RUNNER_TEMP/failed-view-stderr.txt"
            exit "$result"
          fi
          node scripts/diagnose-eas-staging-build-v3132.mjs "$RUNNER_TEMP/failed-build.json"
