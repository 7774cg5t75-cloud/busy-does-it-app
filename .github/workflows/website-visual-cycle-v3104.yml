name: V3.104 private website before-and-after review QA
# Code, browser screenshots, and DOM checks only: zero paid AI and EAS calls.
on:
  push:
    branches: [v3.104]
    paths:
      - .github/workflows/website-visual-cycle-v3104.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-private-website-review-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
    steps:
      - name: Check out V3.104
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Existing and new security regressions
        run: |
          node scripts/check-production.mjs
          node scripts/check-website-review-cycle-v3104.mjs
          node scripts/check-real-website-vision-v3103.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compile iPhone JS without submitting EAS build
        run: npx expo export --platform ios --output-dir /tmp/busy-v3104-ios-js-only
      - name: Generate fictional private originals and approved candidate
        run: node scripts/build-website-design-gallery-v3100.mjs /tmp/busy-v3104-demo
      - name: Install browser for real screenshots
        run: npx playwright install --with-deps chromium
      - name: Capture original and revised private website on phone and desktop
        run: |
          node scripts/run-offline-website-visual-audit-v3104.mjs \
            /tmp/busy-v3104-demo/01-gardening-minimal.html \
            /tmp/busy-v3104-demo/01-gardening-minimal-candidate.html \
            /tmp/busy-v3104-reviewed
      - name: Verify screenshot files and bounded UI measurements
        run: |
          test -s /tmp/busy-v3104-reviewed/original-mobile.png
          test -s /tmp/busy-v3104-reviewed/original-desktop.png
          test -s /tmp/busy-v3104-reviewed/candidate-mobile.png
          test -s /tmp/busy-v3104-reviewed/candidate-desktop.png
          node --input-type=module -e 'import fs from "node:fs";const r=JSON.parse(fs.readFileSync("/tmp/busy-v3104-reviewed/offline-visual-audit.json"));if(r.paidVisionReviewOccurred||r.websitePublished||!r.candidate)process.exit(1);console.log("Two independent browser renders complete, zero paid reviews.");'
      - name: Save screenshots and browser audit report
        uses: actions/upload-artifact@v4
        with:
          name: v3104-fictional-before-after-website
          path: /tmp/busy-v3104-reviewed/
          retention-days: 14
      - name: No billable provider or public deployment invoked
        run: echo "No EAS builds, no paid AI calls, no Supabase deployment, no public website changes."
