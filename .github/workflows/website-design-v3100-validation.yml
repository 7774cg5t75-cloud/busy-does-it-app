name: V3.100 no-credit visual and iPhone JS validation
# This job never submits an Expo EAS build and never deploys a customer site.
on:
  push:
    branches: [v3.100]
    paths:
      - .github/workflows/website-design-v3100-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-intelligent-websites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Run website and previous release regressions
        run: |
          node scripts/check-production.mjs
          node scripts/check-intelligent-website-design-v3100.mjs
          node scripts/check-repeat-hosted-preview-v397.mjs
      - name: Install source dependencies
        run: npm install --no-audit --no-fund
      - name: Verify deployable website worker TypeScript
        run: |
          node --input-type=module -e 'import fs from "node:fs";import {parse} from "@babel/parser";parse(fs.readFileSync("supabase/functions/busy-website-worker/index.ts","utf8"),{sourceType:"module",plugins:["typescript"]});console.log("Website worker parses without errors.");'
      - name: Compile iPhone JavaScript without submitting a paid build
        run: npx expo export --platform ios --output-dir /tmp/busy-v3100-ios-js
      - name: Generate five offline example websites
        run: node scripts/build-website-design-gallery-v3100.mjs /tmp/busy-design-gallery
      - name: Install browser for visual snapshots
        run: npx --yes playwright@1.58.2 install --with-deps chromium
      - name: Take desktop and mobile screenshots
        run: |
          for path in /tmp/busy-design-gallery/*.html; do
            stem="${path%.html}"
            npx --yes playwright@1.58.2 screenshot --browser chromium --viewport-size="1440,900" --full-page "file://$path" "${stem}-desktop.png"
            npx --yes playwright@1.58.2 screenshot --browser chromium --viewport-size="390,844" --full-page "file://$path" "${stem}-mobile.png"
          done
      - name: Upload five site designs and ten screenshots
        uses: actions/upload-artifact@v4
        with:
          name: busy-v3100-design-gallery
          path: /tmp/busy-design-gallery/
          retention-days: 14
      - name: Confirm no Expo credit use
        run: echo "Visual specimens and native JS validated. No EAS cloud builds, cloud AI, customer-site publishing or DNS changes."
