name: V3.162 Intelligent App Improvement Cycle
on:
  push:
    branches: [v3.162]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design-improvement:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: V3.162 safe improvement loop, accessibility descriptions and historic regression suite
        run: |
          node scripts/check-app-design-iteration-v3162.mjs
          node scripts/check-app-visual-comparison-v3161.mjs
          node scripts/check-app-design-v3160.mjs
          node scripts/check-app-visual-review-v3159.mjs
          node scripts/check-app-builder-v3158.mjs
          node scripts/check-intelligent-app-studio-v3157.mjs
          node scripts/check-app-voice-layout-v3156.mjs
          node scripts/check-native-public-booking-v3155.mjs
          node scripts/check-app-context-editor-v3155.mjs
          node scripts/check-app-builder-dual-track-v3153.mjs
          node scripts/check-standalone-native-v3154.mjs
          node scripts/check-production.mjs
      - name: Install pinned Expo packages
        run: npm install --no-audit --no-fund
      - name: Parse Busy native and Edge code
        run: node scripts/check-app-native-syntax-v3154.mjs
      - name: Export Busy iOS and Android
        run: |
          npx expo export --platform ios --output-dir /tmp/bdi-v3162-ios
          npx expo export --platform android --output-dir /tmp/bdi-v3162-android
      - name: Export standalone iOS and Android prototype
        run: |
          node scripts/prepare-standalone-prototype-v3154.mjs
          cd .tmp/standalone-prototype-v3154
          ../../node_modules/.bin/expo export --platform ios --output-dir /tmp/bdi-v3162-standalone-ios
          ../../node_modules/.bin/expo export --platform android --output-dir /tmp/bdi-v3162-standalone-android
      - name: Explicitly retain verification boundaries
        run: echo "Private rechecks are configuration-level only. CI does not enable paid AI, certify accessibility, validate live booking journeys, sign apps, or deploy services."
