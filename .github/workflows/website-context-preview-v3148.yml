name: V3.148 private selected-change previews and mobile UX
on:
  push:
    branches: [v3.148]
    paths:
      - 'src/core/websiteSelectedChangePreview.mjs'
      - 'supabase/functions/busy-website-worker/designSystem.mjs'
      - 'src/core/websiteContextPlan.mjs'
      - 'src/core/websiteViewportEvidence.mjs'
      - 'src/core/websiteTapToEdit.mjs'
      - 'src/screens/websiteTapEditor.js'
      - 'src/screens/websiteBuilder.js'
      - 'src/core/websiteResponsivePreview.mjs'
      - 'scripts/check-website-responsive-preview-v3148.mjs'
      - 'src/app/AppController.js'
      - 'scripts/check-website-selection-preview-v3148.mjs'
      - 'scripts/check-website-context-plan-v3147.mjs'
      - 'scripts/check-website-viewport-coverage-v3147.mjs'
      - 'scripts/check-website-selection-preview-browser-v3148.mjs'
      - 'scripts/check-website-context-plan-browser-v3147.mjs'
      - '.github/workflows/website-context-preview-v3148.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  context-review:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Verify no-save before-and-after preview, atomic selected changes and older regressions
        run: |
          node scripts/check-website-selection-preview-v3148.mjs
          node scripts/check-website-responsive-preview-v3148.mjs
          node scripts/check-website-context-plan-v3147.mjs
          node scripts/check-website-viewport-coverage-v3147.mjs
          node scripts/check-universal-context-toolbar-v3146.mjs
          node scripts/check-website-deeper-review-v3145.mjs
          node scripts/check-website-measured-coach-v3144.mjs
          node scripts/check-website-visual-inspection-v3143.mjs
          node scripts/check-website-voice-reliability-v3142.mjs
          node scripts/check-website-voice-selection-v3141.mjs
          node scripts/check-website-context-v3140.mjs
          node scripts/check-website-section-styling-v3139.mjs
          node scripts/check-website-tap-editor-v3138.mjs
          node scripts/check-website-layout-v3134.mjs
          node scripts/check-website-pages-v3135.mjs
          node scripts/check-website-standalone-v3136.mjs
          node scripts/check-website-original-media-v3137.mjs
          node scripts/check-professional-websites-v399.mjs
          node scripts/check-production.mjs
      - name: Install native JS and Playwright Chromium requirements
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check phone/tablet/desktop rendered previews, touch and visual quality
        run: |
          node scripts/check-website-selection-preview-browser-v3148.mjs
          node scripts/check-website-context-plan-browser-v3147.mjs
          node scripts/check-universal-context-toolbar-browser-v3146.mjs
          node scripts/check-website-tap-browser-v3138.mjs
          node scripts/check-website-context-browser-v3140.mjs
          node scripts/check-website-contrast-browser-v3145.mjs
          node scripts/check-website-screenshot-loop-v3144.mjs
          node scripts/check-website-visual-browser-v3143.mjs
          node scripts/check-website-section-browser-v3139.mjs
      - name: Export unsigned native iOS and Android JavaScript
        run: |
          npx expo export --platform ios --output-dir /tmp/busy-v3148-ios-js
          npx expo export --platform android --output-dir /tmp/busy-v3148-android-js
      - name: Deployment and spending boundary
        run: echo "No customer data publish, signed device build, paid model call, transcription request or hosted deployment."
