name: V3.113 professional design alternatives and registrar sandbox
on:
  push:
    branches: [v3.113]
    paths:
      - 'src/core/websiteDesignAlternatives.mjs'
      - 'src/screens/websiteBuilder.js'
      - 'scripts/build-website-design-gallery-v3100.mjs'
      - 'scripts/lib/domainRegistrarSandbox-v3113.mjs'
      - 'scripts/check-website-private-alternatives-v3113.mjs'
      - 'scripts/check-website-guided-alternative-v3113.mjs'
      - 'scripts/check-website-rendered-diversity-v3112.mjs'
      - '.github/workflows/website-private-design-v3113.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-design-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Verify preview safety, owner actions and complete fake registrar journey
        run: |
          node scripts/check-website-private-alternatives-v3113.mjs
          node scripts/check-website-registrar-gateway-v3112.mjs
          node scripts/check-website-domain-shopping-v3111.mjs
      - run: npm install --no-audit --no-fund
      - name: Verify updated iPhone UI bundles (no EAS/native release)
        run: npx expo export --platform ios --output-dir /tmp/busy-v3113-ios-js
      - run: npx playwright install --with-deps chromium
      - name: Generate diverse fictional sites and owner-selected design candidate
        run: node scripts/build-website-design-gallery-v3100.mjs /tmp/busy-v3113-gallery
      - name: Test actual before/after screenshots and reject measured regressions
        run: node scripts/check-website-guided-alternative-v3113.mjs /tmp/busy-v3113-gallery /tmp/busy-v3113-candidate
      - name: Protect original individual design diversity
        run: node scripts/check-website-rendered-diversity-v3112.mjs /tmp/busy-v3113-gallery /tmp/busy-v3113-designs
      - name: Check phone and desktop quality on every generated design
        run: |
          node scripts/check-website-responsive-quality-v3109.mjs /tmp/busy-v3113-gallery /tmp/busy-v3113-responsive
          node scripts/check-website-keyboard-quality-v3110.mjs /tmp/busy-v3113-gallery /tmp/busy-v3113-accessibility
      - uses: actions/upload-artifact@v4
        with:
          name: v3113-website-screenshot-before-after
          path: |
            /tmp/busy-v3113-candidate/
            /tmp/busy-v3113-designs/
            /tmp/busy-v3113-responsive/
            /tmp/busy-v3113-accessibility/
          retention-days: 7
      - run: echo "No paid vision/registrar calls, customer data, DNS changes, public publishing or signed build."
