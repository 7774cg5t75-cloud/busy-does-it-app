name: V3.98 iPhone website quality test
# One paid-credit-aware EAS request. Only this workflow file triggers build.
on:
  push:
    branches: [v3.98]
    paths:
      - .github/workflows/ios-preview-v398.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-signed-ios-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: "1"
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Check version and registered-device profile
        run: |
          node -e "const p=require('./package.json'),a=require('./app.json').expo;if(p.version!=='3.98.0'||a.version!=='3.98.0'||a.ios.buildNumber!=='18'||a.ios.bundleIdentifier!=='com.busydoesit.app'||!a.extra?.eas?.projectId)process.exit(1)"
      - name: Run all production and website checks first
        run: |
          node scripts/check-production.mjs
          node scripts/check-website-quality-v398.mjs
          node scripts/check-hosted-website-preview-v395.mjs
          node scripts/check-repeat-hosted-preview-v397.mjs
      - name: Confirm EAS connected
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Expo token missing; no cloud build attempted."
            exit 1
          fi
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Verify iPhone bundle before cloud billing
        run: npx expo export --platform ios --output-dir /tmp/busy-v398-ios-verified
      - name: Submit exactly one signed iOS preview request
        run: |
          echo "Submitting once only. No automatic retries, no public website publishing."
          npx --yes eas-cli@latest build --platform ios --profile preview --non-interactive --no-wait
