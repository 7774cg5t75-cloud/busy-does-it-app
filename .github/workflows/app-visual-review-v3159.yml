name: V3.159 App Visual Reviewer and Safe Editing
on:
  push:
    branches: [v3.159]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app-visual-reviewer:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: V3.159 privacy, AI metering and visual review contracts
        run: |
          node scripts/check-app-visual-review-v3159.mjs
          node scripts/check-app-builder-v3158.mjs
          node scripts/check-intelligent-app-studio-v3157.mjs
          node scripts/check-app-voice-layout-v3156.mjs
          node scripts/check-native-public-booking-v3155.mjs
          node scripts/check-app-context-editor-v3155.mjs
          node scripts/check-app-builder-dual-track-v3153.mjs
          node scripts/check-standalone-native-v3154.mjs
          node scripts/check-production.mjs
      - name: Install pinned Expo dependencies
        run: npm install --no-audit --no-fund
      - name: Validate native JSX and trusted Edge syntax
        run: node scripts/check-app-native-syntax-v3154.mjs
      - name: Export Busy iOS and Android bundles
        run: |
          npx expo export --platform ios --output-dir /tmp/bdi-v3159-ios
          npx expo export --platform android --output-dir /tmp/bdi-v3159-android
      - name: Export the standalone prototype independently
        run: |
          node scripts/prepare-standalone-prototype-v3154.mjs
          cd .tmp/standalone-prototype-v3154
          ../../node_modules/.bin/expo export --platform ios --output-dir /tmp/bdi-v3159-standalone-ios
          ../../node_modules/.bin/expo export --platform android --output-dir /tmp/bdi-v3159-standalone-android
      - name: Release constraints
        run: echo "CI does not deploy app functions or quota migration, grant opt-in, incur AI charges, sign binaries, or visually certify device screenshots."
