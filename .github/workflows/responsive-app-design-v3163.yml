name: V3.163 Responsive Business App Design Intelligence
on:
  push:
    branches: [v3.163]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive-app-design:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Responsive layout, design rationale, privacy and legacy regressions
        run: |
          node scripts/check-responsive-app-v3163.mjs
          node scripts/check-app-design-iteration-v3162.mjs
          node scripts/check-app-visual-comparison-v3161.mjs
          node scripts/check-app-design-v3160.mjs
          node scripts/check-app-visual-review-v3159.mjs
          node scripts/check-app-builder-v3158.mjs
          node scripts/check-intelligent-app-studio-v3157.mjs
          node scripts/check-app-voice-layout-v3156.mjs
          node scripts/check-native-public-booking-v3155.mjs
          node scripts/check-app-context-editor-v3155.mjs
          node scripts/check-app-builder-dual-track-v3153.mjs
          node scripts/check-standalone-native-v3154.mjs
          node scripts/check-production.mjs
      - name: Install pinned Expo dependencies
        run: npm install --no-audit --no-fund
      - name: Parse native JSX and trusted Edge
        run: node scripts/check-app-native-syntax-v3154.mjs
      - name: Export BUSY iOS and Android
        run: |
          npx expo export --platform ios --output-dir /tmp/bdi-v3163-ios
          npx expo export --platform android --output-dir /tmp/bdi-v3163-android
      - name: Export independent standalone iOS and Android prototype
        run: |
          node scripts/prepare-standalone-prototype-v3154.mjs
          cd .tmp/standalone-prototype-v3154
          ../../node_modules/.bin/expo export --platform ios --output-dir /tmp/bdi-v3163-standalone-ios
          ../../node_modules/.bin/expo export --platform android --output-dir /tmp/bdi-v3163-standalone-android
      - name: State release boundary
        run: echo "Screen-size heuristics are not real device screenshots, WCAG certification, browser testing, live backend deployment, signing, or app-store submission."
