name: Native development build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: ios
        type: choice
        options:
          - ios
          - android

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Validate EAS credentials
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is required for a cloud development build."
            exit 1
          fi
          node -e "const a=require('./app.json').expo;if(!a.extra?.eas?.projectId){console.error('EAS projectId is not linked yet.');process.exit(1)}"

      - name: Queue development build
        run: npx --yes eas-cli@latest build --platform ${{ inputs.platform }} --profile development --non-interactive --no-wait
