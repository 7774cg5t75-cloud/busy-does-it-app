name: V3.115 Four-area website intelligence and founder evidence
on:
  push:
    branches: [v3.115]
    paths:
      - 'src/core/websiteDomainLaunchGuide.mjs'
      - 'src/core/founderUsageEvidence.mjs'
      - 'src/core/websiteDesignAlternatives.mjs'
      - 'src/screens/websiteBuilder.js'
      - 'src/screens/websitePublishing.js'
      - 'src/screens/founderServiceCosts.js'
      - 'supabase/functions/busy-website-publish/index.ts'
      - 'supabase/functions/busy-website-publish/designFeedback.mjs'
      - 'supabase/functions/busy-website-worker/websiteReviewCycle.mjs'
      - 'supabase/migrations/20261010182000_v3115_website_design_feedback.sql'
      - 'scripts/check-website-intelligence-v3115.mjs'
      - 'scripts/check-website-cta-v3115.mjs'
      - '.github/workflows/website-intelligence-v3115.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-area-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Check private memory, website design, domain and founder metrics
        run: |
          node scripts/check-website-intelligence-v3115.mjs
          node scripts/check-website-multi-track-v3114.mjs
          node scripts/check-website-private-alternatives-v3113.mjs
          node scripts/check-website-registrar-gateway-v3112.mjs
          node scripts/check-website-visual-improvements-v3106.mjs
      - run: npm install --no-audit --no-fund
      - name: Compile actual iOS JS; no signed build
        run: npx expo export --platform ios --output-dir /tmp/busy-v3115-ios-js
      - run: npx playwright install --with-deps chromium
      - name: Generate fictional business sites and private candidates
        run: node scripts/build-website-design-gallery-v3100.mjs /tmp/busy-v3115-gallery
      - name: Reject hidden primary website actions in real Chromium
        run: node scripts/check-website-cta-v3115.mjs /tmp/busy-v3115-gallery /tmp/busy-v3115-cta
      - name: Recheck original versus private alternative on phone and desktop
        run: node scripts/check-website-guided-alternative-v3113.mjs /tmp/busy-v3115-gallery /tmp/busy-v3115-review
      - name: Recheck visual diversity, responsiveness and accessible keyboard controls
        run: |
          node scripts/check-website-rendered-diversity-v3112.mjs /tmp/busy-v3115-gallery /tmp/busy-v3115-diversity
          node scripts/check-website-responsive-quality-v3109.mjs /tmp/busy-v3115-gallery /tmp/busy-v3115-responsive
          node scripts/check-website-keyboard-quality-v3110.mjs /tmp/busy-v3115-gallery /tmp/busy-v3115-keyboard
      - uses: actions/upload-artifact@v4
        with:
          name: v3115-fictional-websites-and-review-evidence
          path: |
            /tmp/busy-v3115-cta/
            /tmp/busy-v3115-review/
            /tmp/busy-v3115-diversity/
            /tmp/busy-v3115-responsive/
            /tmp/busy-v3115-keyboard/
          retention-days: 7
      - run: echo "No live migrations, AI training, registrar charges, domain purchases, DNS changes or signed builds."
