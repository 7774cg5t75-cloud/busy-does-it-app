name: V3.122 customer intelligence and bounded self-recovery
on:
  push:
    branches: [v3.122]
    paths:
      - 'src/domain/websitePublishing.js'
      - 'src/core/websiteRecoveryCoach.mjs'
      - 'src/core/websiteBrainCoaching.mjs'
      - 'src/core/websiteAutomationBoundary.mjs'
      - 'src/core/founderSafeAutomationSummary.mjs'
      - 'src/screens/websiteBuilder.js'
      - 'src/screens/founderOperations.js'
      - 'supabase/functions/busy-website-worker/websiteReviewAdvice.mjs'
      - 'scripts/check-website-boundaries-v3122.mjs'
      - 'scripts/check-website-connected-experience-v3119.mjs'
      - '.github/workflows/website-intelligent-recovery-v3122.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-intelligence-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Check bounded read retries, owner approval and private preferences
        run: |
          node scripts/check-website-boundaries-v3122.mjs
          node scripts/check-website-resilience-v3121.mjs
          node scripts/check-website-rehearsal-v3120.mjs
          node scripts/check-website-connected-experience-v3119.mjs
          node scripts/check-website-safe-pilot-v3118.mjs
          node scripts/check-website-operational-quality-v3117.mjs
          node scripts/check-website-multi-track-v3114.mjs
      - name: Install dependencies with isolated cache
        run: npm install --no-audit --no-fund --cache /tmp/busy-v3122-npm-cache
      - name: Compile iPhone JavaScript (not a signed native build)
        run: npx expo export --platform ios --output-dir /tmp/busy-v3122-ios-js
      - name: Install real Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Generate nine fictional business websites
        run: node scripts/build-website-design-gallery-v3100.mjs /tmp/busy-v3122-sites
      - name: Verify 18 browser pages, retry once on transient Chromium screenshot failure
        run: |
          for attempt in 1 2; do
            if node scripts/check-website-resilience-browser-v3121.mjs /tmp/busy-v3122-sites /tmp/busy-v3122-browser; then
              exit 0
            fi
            echo "Chromium browser proof failed on attempt $attempt; retrying at most once."
            sleep 3
          done
          exit 1
      - name: Compare genuine original and edited website quality
        run: node scripts/check-website-guided-alternative-v3113.mjs /tmp/busy-v3122-sites /tmp/busy-v3122-alternative
      - name: Check fictional customer lifecycle and safe review advice
        run: node scripts/check-website-rehearsal-browser-v3120.mjs /tmp/busy-v3122-sites /tmp/busy-v3122-alternative /tmp/busy-v3122-lifecycle
      - name: Check screenshot identity, obscured actions and design variety
        run: |
          node scripts/check-website-first-fold-v3116.mjs /tmp/busy-v3122-sites /tmp/busy-v3122-firstfold
          node scripts/check-website-rendered-diversity-v3112.mjs /tmp/busy-v3122-sites /tmp/busy-v3122-diversity
      - name: Check responsive layout and keyboard accessibility
        run: |
          node scripts/check-website-responsive-quality-v3109.mjs /tmp/busy-v3122-sites /tmp/busy-v3122-responsive
          node scripts/check-website-keyboard-quality-v3110.mjs /tmp/busy-v3122-sites /tmp/busy-v3122-keyboard
      - uses: actions/upload-artifact@v4
        with:
          name: v3122-private-fictional-website-safety-evidence
          path: |
            /tmp/busy-v3122-browser/
            /tmp/busy-v3122-alternative/
            /tmp/busy-v3122-lifecycle/
            /tmp/busy-v3122-firstfold/
            /tmp/busy-v3122-diversity/
            /tmp/busy-v3122-responsive/
            /tmp/busy-v3122-keyboard/
          retention-days: 7
      - name: Assert development-only scope
        run: echo "No customer pilot, paid AI calls, automatic repairs, live DNS changes, production migrations, domain orders, or signed iPhone builds."
