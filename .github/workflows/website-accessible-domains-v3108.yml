name: V3.108 customer websites and domain-safe setup QA
on:
  push:
    branches: [v3.108]
    paths:
      - 'supabase/functions/busy-website-worker/designSystem.mjs'
      - 'supabase/functions/busy-website-publish/domainOwnership.mjs'
      - 'supabase/functions/busy-website-publish/index.ts'
      - 'src/core/websiteDomainGuide.mjs'
      - 'src/screens/websitePublishing.js'
      - 'scripts/check-website-generated-readability-v3108.mjs'
      - 'scripts/check-website-readability-and-domains-v3108.mjs'
      - '.github/workflows/website-accessible-domains-v3108.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-browser-website-and-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Run strict DNS TXT and design-unit regression checks
        run: node scripts/check-website-readability-and-domains-v3108.mjs
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build nine fictional and individual websites
        run: node scripts/build-website-design-gallery-v3100.mjs /tmp/busy-v3108-gallery
      - name: Measure real mobile/desktop readability and tap targets
        run: node scripts/check-website-generated-readability-v3108.mjs /tmp/busy-v3108-gallery /tmp/busy-v3108-measured
      - name: Retain bounded fictional browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: v3108-fictional-websites-accessibility
          path: /tmp/busy-v3108-measured/
          retention-days: 7
      - run: echo "No provider purchase, live DNS changes, EAS signed builds, Supabase deployment or billable AI."
