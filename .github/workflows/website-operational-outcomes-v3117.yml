name: V3.117 measurable website outcomes, private learning and founder triage
on:
  push:
    branches: [v3.117]
    paths:
      - 'src/screens/websiteBuilder.js'
      - 'src/screens/founderOperations.js'
      - 'src/core/founderOperationalPriorities.mjs'
      - 'src/core/websiteReleaseReadiness.mjs'
      - 'src/app/AppController.js'
      - 'supabase/functions/busy-website-publish/designFeedback.mjs'
      - 'supabase/functions/busy-website-worker/websiteDesignDecision.mjs'
      - 'supabase/migrations/20261010195000_v3117_website_design_owner_outcomes.sql'
      - 'scripts/check-website-operational-quality-v3117.mjs'
      - 'scripts/check-website-design-decision-v3117.mjs'
      - '.github/workflows/website-operational-outcomes-v3117.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-measured-quality-and-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Verify actual customer outcome semantics and platform safety
        run: |
          node scripts/check-website-operational-quality-v3117.mjs
          node scripts/check-website-controlled-rollout-v3116.mjs
          node scripts/check-website-intelligence-v3115.mjs
          node scripts/check-website-multi-track-v3114.mjs
          node scripts/check-website-private-alternatives-v3113.mjs
      - name: Install mobile and browser build dependencies with isolated cache
        run: npm install --no-audit --no-fund --cache /tmp/busy-v3117-npm-cache
      - name: Export new iPhone JavaScript (not a signed native app)
        run: npx expo export --platform ios --output-dir /tmp/busy-v3117-ios-js
      - run: npx playwright install --with-deps chromium
      - name: Create five fictional websites from actual generator
        run: node scripts/build-website-design-gallery-v3100.mjs /tmp/busy-v3117-gallery
      - name: Measure original, revised and deliberately defective designs in Chromium
        run: node scripts/check-website-guided-alternative-v3113.mjs /tmp/busy-v3117-gallery /tmp/busy-v3117-alternative
      - name: Classify browser evidence as actual improvement, safe alternative or regression
        run: node scripts/check-website-design-decision-v3117.mjs /tmp/busy-v3117-alternative /tmp/busy-v3117-decisions
      - name: Verify trusted screenshots and blocked customer actions
        run: node scripts/check-website-first-fold-v3116.mjs /tmp/busy-v3117-gallery /tmp/busy-v3117-first-fold
      - name: Check visual variety, mobile-responsive design and keyboard use
        run: |
          node scripts/check-website-rendered-diversity-v3112.mjs /tmp/busy-v3117-gallery /tmp/busy-v3117-variety
          node scripts/check-website-responsive-quality-v3109.mjs /tmp/busy-v3117-gallery /tmp/busy-v3117-responsive
          node scripts/check-website-keyboard-quality-v3110.mjs /tmp/busy-v3117-gallery /tmp/busy-v3117-keyboard
      - uses: actions/upload-artifact@v4
        with:
          name: v3117-offline-measured-website-and-readiness-proof
          path: |
            /tmp/busy-v3117-alternative/
            /tmp/busy-v3117-decisions/
            /tmp/busy-v3117-first-fold/
            /tmp/busy-v3117-variety/
            /tmp/busy-v3117-responsive/
            /tmp/busy-v3117-keyboard/
          retention-days: 7
      - name: Report controlled scope
        run: echo "No customer outcome analytics, migrations deployed, AI billing, cross-tenant learning, automatic repairs, DNS changes, production release or signed iOS binary."
