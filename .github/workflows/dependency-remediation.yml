name: Read-only dependency security and compatibility evidence
on:
  push:
    branches: [codex/builder-mission15-design-advancement]
    paths:
      - '.github/workflows/dependency-remediation.yml'
      - 'scripts/dependency-*.mjs'
      - 'scripts/apply-tooling-security-patches.mjs'
      - 'security/dependency-*'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: false
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      candidates: ${{ steps.pack.outputs.candidates }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Registry metadata and genuine advisory evidence (no installs)
        run: |
          mkdir -p dependency-evidence/registry
          python3 - <<'PY'
          import subprocess,pathlib,json
          p=pathlib.Path('dependency-evidence');rows=[]
          cmds=[('audit',['npm','audit','--json','--ignore-scripts'])]
          for pkg in ['zod@4.6.6','glob@14.0.2','minimatch@11.0.1','deepmerge@latest','deepmerge-ts@latest','expo@57','@expo/config@57','@expo/cli@57']:
            cmds.append((pkg.replace('/','_'),['npm','view',pkg,'version','dependencies','peerDependencies','engines','dist.integrity','dist.tarball','--json']))
          for name,cmd in cmds:
            r=subprocess.run(cmd,capture_output=True,text=True,timeout=90);(p/'registry'/(name+'.json')).write_text(r.stdout);(p/'registry'/(name+'.log')).write_text(r.stderr);rows.append({'name':name,'exitCode':r.returncode});print(name,r.returncode,flush=True)
          (p/'registry/exits.json').write_text(json.dumps(rows,indent=2))
          audit=json.loads((p/'registry/audit.json').read_text());assert 'metadata'in audit,'Registry audit unavailable; never count connection failure as clean';print(json.dumps(audit['metadata']['vulnerabilities']))
          PY
      - name: Retrieve exact candidate tarballs without scripts
        id: pack
        run: |
          mkdir -p dependency-evidence/tarballs
          npm pack zod@4.6.6 glob@14.0.2 minimatch@11.0.1 --ignore-scripts --pack-destination dependency-evidence/tarballs --json > dependency-evidence/registry/packs.json
          echo 'candidates=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-registry-${{ github.sha }}
          path: dependency-evidence/
          retention-days: 7
          if-no-files-found: error
  compatibility-experiment:
    needs: registry
    if: needs.registry.outputs.candidates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_OFFLINE: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_BUSY_ENVIRONMENT: owner-preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Baseline lock-only installation, no lifecycle scripts
        run: npm ci --ignore-scripts --no-audit
      - name: Actual baseline Expo caller probe
        run: |
          node scripts/dependency-compatibility-probe.mjs
          mv dependency-evidence/compatibility.json dependency-evidence/compatibility-baseline.json
      - name: Disposable scoped-major compatibility experiment (not an approved source override)
        run: |
          cp package-lock.json dependency-evidence/package-lock-baseline.json
          node - <<'JS'
          const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json'));p.overrides={...p.overrides,'@expo/cli':{zod:'4.6.6',glob:'14.0.2'},'@expo/config':{glob:'14.0.2'},'@expo/config-plugins':{glob:'14.0.2'},'@expo/fingerprint':{glob:'14.0.2',minimatch:'11.0.1'},'@expo/metro-config':{glob:'14.0.2'}};fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          JS
          npm install --package-lock-only --ignore-scripts --no-audit
          npm ci --ignore-scripts --no-audit
          cp package-lock.json dependency-evidence/package-lock-candidate.json
      - name: Actual candidate Expo caller probe
        run: node scripts/dependency-compatibility-probe.mjs
      - name: Candidate genuine audit (retain exit and findings)
        if: always()
        run: |
          python3 - <<'PY'
          import subprocess,pathlib,json
          p=pathlib.Path('dependency-evidence');p.mkdir(exist_ok=True);r=subprocess.run(['npm','audit','--json','--ignore-scripts'],capture_output=True,text=True);(p/'audit-candidate.json').write_text(r.stdout);(p/'audit-candidate-exit.json').write_text(json.dumps({'exitCode':r.returncode}));print(r.stdout)
          PY
      - name: Unsigned native compatibility export, no cloud build or distribution
        run: node node_modules/expo/bin/cli export --platform ios --source-maps --output-dir /tmp/busy-dependency-candidate-ios > dependency-evidence/hermes-owner-preview.log 2>&1
      - name: Isolated staging unsigned export
        env:
          EXPO_PUBLIC_BUSY_ENVIRONMENT: isolated-staging
        run: node node_modules/expo/bin/cli export --platform ios --source-maps --output-dir /tmp/busy-dependency-staging-ios > dependency-evidence/hermes-isolated-staging.log 2>&1
      - name: Prove affected tooling packages are absent from mobile source maps
        run: |
          python3 - <<'PY'
          import pathlib,json,re
          result=[]
          for root in ['/tmp/busy-dependency-candidate-ios','/tmp/busy-dependency-staging-ios']:
            files=list(pathlib.Path(root).rglob('*.map'));assert files,'No real bundle maps';hits=[]
            for file in files:
              for s in json.loads(file.read_text()).get('sources',[]):
                if re.search(r'(?:^|/)node_modules/(?:zod|deepmerge|glob|minimatch)(?:/|$)',s):hits.append(s)
            result.append({'environment':root,'maps':len(files),'affectedRuntimeSources':hits});assert not hits,hits
          pathlib.Path('dependency-evidence/mobile-reachability.json').write_text(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-compatibility-${{ github.sha }}
          path: dependency-evidence/
          retention-days: 7
          if-no-files-found: error
