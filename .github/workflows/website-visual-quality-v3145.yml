name: V3.145 coordinated visual quality and business preference checks
on:
  push:
    branches: [v3.145]
    paths:
      - 'src/core/websiteVisualCheck.mjs'
      - 'src/core/websiteMeasuredDesignCoach.mjs'
      - 'src/screens/websiteBuilder.js'
      - 'src/app/AppController.js'
      - 'scripts/check-website-deeper-review-v3145.mjs'
      - 'scripts/check-website-contrast-browser-v3145.mjs'
      - 'scripts/check-website-visual-inspection-v3143.mjs'
      - '.github/workflows/website-visual-quality-v3145.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-and-recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Verify measured risk controls, scoped feedback and historical regressions
        run: |
          node scripts/check-website-deeper-review-v3145.mjs
          node scripts/check-website-measured-coach-v3144.mjs
          node scripts/check-website-visual-inspection-v3143.mjs
          node scripts/check-website-voice-reliability-v3142.mjs
          node scripts/check-website-voice-selection-v3141.mjs
          node scripts/check-website-context-v3140.mjs
          node scripts/check-website-section-styling-v3139.mjs
          node scripts/check-website-tap-editor-v3138.mjs
          node scripts/check-website-layout-v3134.mjs
          node scripts/check-website-pages-v3135.mjs
          node scripts/check-website-standalone-v3136.mjs
          node scripts/check-website-original-media-v3137.mjs
          node scripts/check-professional-websites-v399.mjs
          node scripts/check-production.mjs
      - name: Install dependencies and Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify actual typography, contrast, screenshots and responsive layouts
        run: |
          node scripts/check-website-contrast-browser-v3145.mjs
          node scripts/check-website-screenshot-loop-v3144.mjs
          node scripts/check-website-visual-browser-v3143.mjs
          node scripts/check-website-context-browser-v3140.mjs
          node scripts/check-website-tap-browser-v3138.mjs
          node scripts/check-website-section-browser-v3139.mjs
      - name: Verify unsigned iOS and Android JS exports
        run: |
          npx expo export --platform ios --output-dir /tmp/busy-v3145-ios-js
          npx expo export --platform android --output-dir /tmp/busy-v3145-android-js
      - name: Deployment boundary
        run: echo "No production or staging changes, signed mobile build, paid screenshot review, cloud provider call or public website publish."
