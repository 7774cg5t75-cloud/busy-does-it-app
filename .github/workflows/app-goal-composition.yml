          python3 - <<'PY_PIN'
          import hashlib,os,pathlib,tarfile
          archive=pathlib.Path(os.environ['POSTGREST_ARCHIVE'])
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='98de1c0be7787aea5f5e11a25f303ea0077634d6fc1000b687bfa825fd27d299'
          with tarfile.open(archive) as package:
              matches=[entry for entry in package.getmembers() if entry.isfile() and entry.name=='postgrest']
              assert len(matches)==1
              binary=package.extractfile(matches[0]).read()
          assert hashlib.sha256(binary).hexdigest()=='e62299f98f67938f754291340b2fc07b69685546e6017b455ef3e776daef45ee'
          target=pathlib.Path(os.environ['POSTGREST_BIN']);target.write_bytes(binary);target.chmod(0o700)
          PY_PIN
          BUSY_LOCAL_PG_BIN_DIR=/usr/lib/postgresql/17/bin node scripts/check-ai-lab-b3-postgrest.mjs > .test-artifacts/app-goal-composition/postgrest-http.log 2>&1 || { tail -n 50 .test-artifacts/app-goal-composition/postgrest-http.log; exit 1; }
