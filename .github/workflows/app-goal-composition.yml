permissions:
  contents: read
concurrency:
  group: private-app-goal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Signed PostgreSQL 17 tooling matching staging ACLs
        run: |
          # PostgreSQL16 cannot represent staging's existing MAINTAIN privilege.
          # Official PGDG signing fingerprint: postgresql.org/download/linux/ubuntu/.
          test "$(. /etc/os-release; echo "$VERSION_CODENAME")" = noble
          # Ubuntu's installed postgresql-common already supplies the SAME
          # public key. Verify package ownership and its full primary fingerprint;
          # missing/unreviewed key material stops without a network fallback.
          # The observed /usr/share parent is writable. Freeze the packaged
          # bytes exclusively under trusted /etc ancestry before verification.
          sudo /usr/bin/python3 -I - <<'PY'
          import json, os, stat, sys
          source = '/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc'
          target = '/etc/apt/keyrings/busy-pgdg.asc'
          stage, public_path, metadata = 'directory-metadata', '/', None
          def require(condition):
              if not condition:
                  raise RuntimeError('refused')
          def identity(value):
              return value.st_dev, value.st_ino, value.st_uid, value.st_size
          def report(error):
              diagnostic = {'stage': stage, 'path': public_path, 'errno': error.errno if isinstance(error, OSError) and isinstance(error.errno, int) and 0 < error.errno < 4096 else None}
              if metadata is not None:
                  diagnostic.update({'uid': metadata.st_uid if 0 <= metadata.st_uid <= 4294967295 else None, 'permissionMode': format(stat.S_IMODE(metadata.st_mode), '04o'), 'bytes': metadata.st_size if 0 <= metadata.st_size <= 9223372036854775807 else None, 'kind': 'directory' if stat.S_ISDIR(metadata.st_mode) else 'regular' if stat.S_ISREG(metadata.st_mode) else 'symlink' if stat.S_ISLNK(metadata.st_mode) else 'other'})
              print('CI PGDG fixed public-key freeze refused; no repository trust was changed. diagnostic=' + json.dumps(diagnostic, separators=(',', ':')), file=sys.stderr)
          try:
              os.umask(0o022)
              for directory in ('/', '/etc', '/etc/apt', '/etc/apt/keyrings'):
                  stage, public_path, metadata = 'directory-metadata', directory, None
                  if directory == '/etc/apt/keyrings' and not os.path.lexists(directory):
                      os.mkdir(directory, 0o755)
                  metadata = os.lstat(directory)
                  require(stat.S_ISDIR(metadata.st_mode) and not stat.S_ISLNK(metadata.st_mode) and metadata.st_uid == 0 and metadata.st_mode & 0o022 == 0 and os.path.realpath(directory) == directory)
              stage, public_path, metadata = 'packaged-source-metadata', source, None
              before = os.lstat(source)
              metadata = before
              require(stat.S_ISREG(before.st_mode) and not stat.S_ISLNK(before.st_mode) and before.st_uid == 0 and 0 < before.st_size <= 32768 and os.path.realpath(source) == source)
              stage = 'packaged-source-open-read'
              with os.fdopen(os.open(source, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW), 'rb') as original:
                  require(identity(os.fstat(original.fileno())) == identity(before))
                  original_bytes = original.read(32769)
                  require(len(original_bytes) == before.st_size)
                  stage, public_path, metadata = 'exclusive-target-create', target, None
                  with os.fdopen(os.open(target, os.O_RDWR | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW | os.O_CLOEXEC, 0o644), 'w+b') as frozen:
                      require(frozen.write(original_bytes) == len(original_bytes))
                      frozen.flush()
                      os.fsync(frozen.fileno())
                      stage = 'frozen-target-verification'
                      metadata = os.fstat(frozen.fileno())
                      current = os.lstat(target)
                      frozen.seek(0)
                      require(stat.S_ISREG(metadata.st_mode) and metadata.st_uid == 0 and stat.S_IMODE(metadata.st_mode) == 0o644 and metadata.st_size == len(original_bytes) and identity(current) == identity(metadata) and not stat.S_ISLNK(current.st_mode) and os.path.realpath(target) == target and frozen.read(32769) == original_bytes)
                  stage, public_path, metadata = 'packaged-source-stability', source, before
                  original.seek(0)
                  require(original.read(32769) == original_bytes and identity(os.lstat(source)) == identity(before))
              print('CI PGDG fixed packaged public-key bytes frozen exclusively under trusted /etc ancestry; fingerprint verification still required.')
          except (OSError, RuntimeError) as error:
              report(error)
              raise SystemExit(1)
          PY
          node scripts/verify-ci-pgdg-key.mjs
          echo 'deb [signed-by=/etc/apt/keyrings/busy-pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/busy-pgdg.list >/dev/null
          # Suppress all service starts in this ephemeral runner installation only.
          if sudo test -e /usr/sbin/policy-rc.d; then sudo cp -p /usr/sbin/policy-rc.d "$RUNNER_TEMP/busy-policy-rc.d"; fi
          restore_policy() { if test -e "$RUNNER_TEMP/busy-policy-rc.d"; then sudo cp -p "$RUNNER_TEMP/busy-policy-rc.d" /usr/sbin/policy-rc.d; else sudo rm -f /usr/sbin/policy-rc.d; fi; }
          trap restore_policy EXIT
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod 0755 /usr/sbin/policy-rc.d
          sudo sed -i 's/^[#[:space:]]*create_main_cluster[[:space:]]*=.*/create_main_cluster = false/' /etc/postgresql-common/createcluster.conf
          grep -qx 'create_main_cluster = false' /etc/postgresql-common/createcluster.conf
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends -o Dpkg::Options::=--force-confold postgresql-17 postgresql-client-17
          /usr/lib/postgresql/17/bin/postgres --version
          dpkg-query -W postgresql-17 postgresql-client-17
      - name: Reviewed lock installation and security guard
        run: |
          npm ci --ignore-scripts --no-audit
          node scripts/apply-tooling-security-patches.mjs
          node scripts/check-dependency-security.mjs
          npm ci --prefix scripts/offline-tools --ignore-scripts --no-audit
      - name: Original contract and component behaviour
        run: |
          mkdir -p .test-artifacts/app-goal-composition
          node scripts/check-mission16-whole-site.mjs
