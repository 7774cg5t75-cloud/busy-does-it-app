name: Private App goal composition and original authority verification
on:
  push:
    branches: [codex/builder-mission15-design-advancement]
    paths:
      - '.github/workflows/app-goal-composition.yml'
      - 'src/core/appEnquirySource.mjs'
      - 'src/components/AppEnquirySourceContext.js'
      - 'src/components/CanonicalWorkPanel.js'
      - 'src/components/QuoteEnquiryContext.js'
      - 'src/staging/ConnectedEnquiryReview.js'
      - 'src/staging/connectedEnquiryJourney.mjs'
      - 'src/screens/miniApps.js'
      - 'src/screens/appEnquiryRequestPreview.js'
      - 'scripts/check-contextual-app-enquiries.mjs'
      - 'src/core/privateAppProject.mjs'
      - 'src/core/appScreenComposition.mjs'
      - 'src/staging/connectedApplicationRuntime.mjs'
      - 'src/staging/stagingAuthInspectorV3131.mjs'
      - 'src/core/privateFormEnquiry.mjs'
      - 'src/screens/privateFormEnquiryPreview.js'
      - 'src/components/FormEnquiryContext.js'
      - 'src/components/AppEnquirySourceContext.js'
      - 'standalone/template/nativeCustomerActions.mjs'
      - 'supabase/functions/busy-mini-app-guest/index.ts'
      - 'scripts/check-private-form-enquiries.mjs'
      - 'src/core/privateScreenBindings.mjs'
      - 'src/screens/privateScreenLibrary.js'
      - 'src/screens/privateArtifactFields.js'
      - 'supabase/functions/busy-mini-apps/privateScreenService.mjs'
      - 'supabase/functions/busy-mini-apps/publicScreenArrangement.mjs'
      - 'scripts/check-private-screen-editor.mjs'
      - 'src/core/privateForm*'
      - 'src/core/privateArtifact*'
      - 'src/core/artifactIntegrity.mjs'
      - 'src/screens/privateForm*'
      - 'scripts/check-private-forms-native.mjs'
      - 'security/native-artifact-crypto.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/core/privateFunctionAccount.mjs'
      - 'src/screens/privateFunctionLibrary.js'
      - 'supabase/functions/busy-mini-apps/privateFunctionService.mjs'
      - 'docs/sql-proposals/private-app-functions/**'
      - 'scripts/check-private-function-artifacts.mjs'
      - 'src/core/privateCalculation.mjs'
      - 'src/core/privateCalculationPilot.mjs'
      - 'src/screens/privateCalculationPilot.js'
      - 'scripts/check-private-calculation-pilot.mjs'
      - 'src/core/appScreenProposal.mjs'
      - 'src/core/appCoordinatedStudio.mjs'
      - 'src/core/appDraftComposition.mjs'
      - 'src/core/appOwnerLocks.mjs'
      - 'standalone/template/App.js'
      - 'standalone/template/nativeBusinessClient.js'
      - 'supabase/functions/busy-mini-app-guest/publicNativeProjection.mjs'
      - 'scripts/check-app-screen-composition.mjs'
      - 'src/core/appProjectContinuation.mjs'
      - 'src/core/businessContentRecords.mjs'
      - 'standalone/template/businessContentView.js'
      - 'scripts/check-app-project-continuation.mjs'
      - 'supabase/functions/busy-mini-apps/privateProjectService.mjs'
      - 'supabase/functions/busy-mini-apps/index.ts'
      - 'scripts/check-private-app-project.mjs'
      - 'src/core/appGoalComposition.mjs'
      - 'src/core/appRecordComposition.mjs'
      - 'scripts/check-app-record-composition.mjs'
      - 'src/core/governedBuilderProposal.mjs'
      - 'src/core/universalBuilderPlanV3210.mjs'
      - 'src/screens/appGoalCompositionEditor.js'
      - 'scripts/check-app-goal-composition.mjs'
      - 'scripts/check-whole-app-postgres.mjs'
      - 'docs/sql-proposals/connected-builders/**'
      - 'scripts/lib/whole-app-*.mjs'
      - 'scripts/prepare-listing-lifecycle.mjs'
      - 'scripts/check-frozen-source-evidence.mjs'
      - 'scripts/testing/regressions.py'
      - 'scripts/testing/regressions.json'
      - 'src/core/canonicalWorkSession.mjs'
permissions:
  contents: read
concurrency:
  group: private-app-goal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_OFFLINE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Reviewed lock installation and security guard
        run: |
          npm ci --ignore-scripts --no-audit
          node scripts/apply-tooling-security-patches.mjs
          node scripts/check-dependency-security.mjs
          npm ci --prefix scripts/offline-tools --ignore-scripts --no-audit
      - name: Original contract and component behaviour
        run: |
          mkdir -p .test-artifacts/app-goal-composition
          node scripts/check-private-form-enquiries.mjs
          node scripts/check-private-screen-editor.mjs
          node scripts/check-private-forms-native.mjs
          node node_modules/expo-modules-autolinking/bin/expo-modules-autolinking resolve --platform apple --json > .test-artifacts/app-goal-composition/native-autolinking.json
          python3 -c "import json;d=json.load(open('.test-artifacts/app-goal-composition/native-autolinking.json'));assert any(m['packageName']=='expo-crypto' and m['packageVersion']=='57.0.4' for m in d['modules'])"
          node scripts/check-private-function-artifacts.mjs
          node scripts/check-private-calculation-pilot.mjs
          node scripts/check-mission15-phase10-gallery-parity.mjs
          node scripts/check-mission15-phase31-service-resume.mjs
          node scripts/check-app-screen-composition.mjs
          node scripts/check-app-project-continuation.mjs
          node scripts/check-private-app-project.mjs
          node scripts/check-frozen-source-evidence.mjs
          node scripts/check-contextual-app-enquiries.mjs
          node scripts/check-app-record-composition.mjs
          node scripts/check-app-goal-composition.mjs
          node scripts/check-governed-builder-proposals.mjs
          node scripts/check-production.mjs
          node scripts/check-security-baseline.mjs
          node scripts/check-security-by-design.mjs
          node scripts/testing/syntax.mjs src/core/appGoalComposition.mjs src/core/governedBuilderProposal.mjs src/core/universalBuilderPlanV3210.mjs src/screens/appGoalCompositionEditor.js src/screens/miniApps.js src/staging/ConnectedBuilderWorkspace.js
      - name: Genuine original Edge checks with pinned official verification tools
        run: |
          EDGE_TOOLS="$RUNNER_TEMP/busy-screen-edge-tools"
          EDGE_SOURCE="$RUNNER_TEMP/busy-screen-edge-source"
          npm install --prefix "$EDGE_TOOLS" --ignore-scripts --no-audit --no-fund --package-lock=false deno@2.5.6 @supabase/supabase-js@2.118.0
          mkdir -p "$EDGE_SOURCE"
          cp -R src supabase standalone "$EDGE_SOURCE/"
          ln -s "$EDGE_TOOLS/node_modules" "$EDGE_SOURCE/node_modules"
          diff -qr src "$EDGE_SOURCE/src"
          diff -qr supabase "$EDGE_SOURCE/supabase"
          diff -qr standalone "$EDGE_SOURCE/standalone"
          DENO_DIR="$RUNNER_TEMP/busy-screen-deno-cache" "$EDGE_TOOLS/node_modules/.bin/deno" check --node-modules-dir=manual --frozen --config "$EDGE_SOURCE/supabase/connected-staging.deno.json" "$EDGE_SOURCE"/supabase/functions/*/index.ts > .test-artifacts/app-goal-composition/deno.log 2>&1
          echo "BUSY_EDGE_RESULT all_25_original_entrypoints_exit_0"
      - name: Disposable local PostgreSQL, no TCP or hosted connection
        run: |
          PG_BIN="$(pg_config --bindir)"
          PG_DATA="$RUNNER_TEMP/busy-app-goal-pg-data"
          PG_SOCKET="$RUNNER_TEMP/busy-app-goal-pg-socket"
          install -d -m 700 "$PG_DATA" "$PG_SOCKET"
          "$PG_BIN/initdb" -D "$PG_DATA" --username=postgres --auth-local=trust --auth-host=reject
          "$PG_BIN/pg_ctl" -D "$PG_DATA" -l "$RUNNER_TEMP/busy-app-goal-pg.log" -o "-k $PG_SOCKET -c listen_addresses='' -c unix_socket_permissions=0700" start
          trap '"$PG_BIN/pg_ctl" -D "$PG_DATA" stop -m fast' EXIT
          "$PG_BIN/psql" -U postgres -h "$PG_SOCKET" -d postgres -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role BYPASSRLS;'
          set +e
          BUSY_LOCAL_PG_BIN="$PG_BIN/psql" BUSY_LOCAL_PG_SOCKET="$PG_SOCKET" BUSY_LOCAL_PG_DATA="$PG_DATA" node scripts/check-whole-app-postgres.mjs > .test-artifacts/app-goal-composition/postgres.log 2>&1
          PG_CHECK_EXIT=$?
          set -e
          if [ "$PG_CHECK_EXIT" -ne 0 ]; then tail -n 35 .test-artifacts/app-goal-composition/postgres.log; exit "$PG_CHECK_EXIT"; fi
          cp .test-artifacts/whole-app/postgres.json .test-artifacts/app-goal-composition/postgres.json
          python3 -c "import json;d=json.load(open('.test-artifacts/app-goal-composition/postgres.json'));print('BUSY_APP_POSTGRES '+json.dumps(d['summary']))"
      - name: Unsigned original Owner Preview and isolated staging exports
        run: |
          EXPO_PUBLIC_BUSY_ENVIRONMENT=owner-preview node scripts/run-expo-safe.mjs export --platform ios --output-dir /tmp/busy-app-goal-owner > .test-artifacts/app-goal-composition/owner-export.log 2>&1
          EXPO_PUBLIC_BUSY_ENVIRONMENT=isolated-staging node scripts/run-expo-safe.mjs export --platform ios --output-dir /tmp/busy-app-goal-staging > .test-artifacts/app-goal-composition/staging-export.log 2>&1
      - name: Complete frozen-source regressions
        run: |
          python3 scripts/testing/regressions.py --output .test-artifacts/app-goal-composition/application.json > .test-artifacts/app-goal-composition/application.log 2>&1
          python3 -c "import json;d=json.load(open('.test-artifacts/app-goal-composition/application.json'));print('BUSY_APPLICATION_RESULT '+json.dumps({k:d[k] for k in ['sourceSha','sourceTree','finalSourceSha','finalSourceTree','sourceStable','workingTreeChanged','summary']}))"
          python3 -c "import json;d=json.load(open('.test-artifacts/app-goal-composition/application.json'));assert d['sourceStable'] and d['sourceSha']==d['finalSourceSha'] and d['sourceTree']==d['finalSourceTree']"
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: private-app-goal-${{ github.sha }}
          path: |
            .test-artifacts/app-goal-composition/
            .test-artifacts/whole-app/postgres.json
          retention-days: 7
