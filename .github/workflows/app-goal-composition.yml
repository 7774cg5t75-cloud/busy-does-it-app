          node scripts/check-mission16-whole-site-ui.mjs
          node scripts/check-mission16-owner-cta-refresh.mjs
          node scripts/check-ai-lab-runner-foundation.mjs
          node scripts/check-mission18-design-intelligence.mjs
          node scripts/check-mission18-creative-rendering.mjs
          node scripts/check-mission18-creative-owner-flow.mjs
