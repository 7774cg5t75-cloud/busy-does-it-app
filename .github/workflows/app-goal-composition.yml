          node scripts/check-mission19-creative-document-rendering.mjs
          node scripts/check-mission19-creative-export.mjs
          node scripts/check-mission17-whole-site.mjs
          node scripts/check-mission17-inner-quality.mjs
          node scripts/check-mission17-navigation.mjs
