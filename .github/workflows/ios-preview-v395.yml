name: V3.95 iPhone hosted website preview fix
# Native rebuild needed: react-native-webview was added to render private HTML.

on:
  push:
    branches: [v3.95]
    paths:
      - .github/workflows/ios-preview-v395.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-ios-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: "1"
    steps:
      - name: Check out V3.95
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Verify exact iPhone build version
        run: |
          node -e "const p=require('./package.json'),a=require('./app.json').expo;if(p.version!=='3.95.0'||a.version!=='3.95.0'||a.ios.buildNumber!=='15'||a.ios.bundleIdentifier!=='com.busydoesit.app'||p.dependencies['react-native-webview']!=='13.16.1'||!a.extra?.eas?.projectId)process.exit(1)"
      - name: Run website preview and foundation gates
        run: |
          node scripts/check-production.mjs
          node scripts/check-website-proof-v393.mjs
          node scripts/check-website-simplicity-v394.mjs
          node scripts/check-hosted-website-preview-v395.mjs
          node scripts/check-snack-dependencies.mjs
      - name: Check cloud build credentials
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Expo token is missing; no native build can be submitted."
            exit 1
          fi
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Export iPhone JavaScript bundle
        run: npx expo export --platform ios --output-dir /tmp/busy-v395-ios-bundle
      - name: Queue registered-device signed iOS preview
        run: npx --yes eas-cli@latest build --platform ios --profile preview --non-interactive --no-wait
