name: Business conversation and readiness checks
on:
  push:
    branches: [v3.60, v3.61]
  pull_request:
    paths:
      - "src/domain/conversationUnderstanding.mjs"
      - "src/domain/businessCreationReadiness.mjs"
      - "src/screens/businessCreationJourney.js"
      - "scripts/check-conversation-understanding.mjs"
      - ".github/workflows/check-conversation-understanding.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-conversation-understanding.mjs
