name: Publish Snack preview

on:
  push:
    branches:
      - 'v*'
    paths-ignore:
      - SNACK_PREVIEW.json
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - SNACK_PREVIEW.json
      - 'docs/**'
  workflow_dispatch:
    inputs:
      approval_phrase:
        description: "Explicit approval for this legacy external/source operation"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-snack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.approval_phrase == 'APPROVE_EXTERNAL_SNACK_PREVIEW' && vars.BUSY_LEGACY_TOOLCHAIN_REVIEWED == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified upstream commit
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 verified upstream commit
        with:
          node-version: 20

      - name: Install Snack SDK
        run: npm install --no-save --package-lock=false --legacy-peer-deps snack-sdk@latest @babel/parser@latest

      - name: Publish clean Snack preview
        env:
          EXPO_PUBLIC_BUSY_AI_URL: ${{ secrets.BUSY_AI_URL }}
          EXPO_PUBLIC_BUSY_AI_TOKEN: ${{ secrets.BUSY_AI_TOKEN }}
        run: node scripts/publish-snack.mjs

      - name: Save preview link in branch
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SNACK_PREVIEW.json
          if git diff --cached --quiet; then
            echo "Preview metadata unchanged"
          else
            git commit -m "Update Snack preview [skip ci]"
            # Publish may already have succeeded. Preserve its receipt; never
            # re-publish or rewrite history to hide an unconfirmed metadata push.
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload preview metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 verified upstream commit
        with:
          name: snack-preview
          path: SNACK_PREVIEW.json
