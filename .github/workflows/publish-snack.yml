name: Publish Snack preview

on:
  push:
    branches:
      - 'v0.*'
      - 'v1.*'
    paths-ignore:
      - SNACK_PREVIEW.json
  pull_request:
    branches:
      - main
    paths-ignore:
      - SNACK_PREVIEW.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Snack SDK
        run: npm install --no-save --package-lock=false --legacy-peer-deps snack-sdk@latest

      - name: Publish clean Snack preview
        run: node scripts/publish-snack.mjs

      - name: Save preview link in branch
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SNACK_PREVIEW.json
          if git diff --cached --quiet; then
            echo "Preview metadata unchanged"
          else
            git commit -m "Update Snack preview [skip ci]"
            git push
          fi

      - name: Upload preview metadata
        uses: actions/upload-artifact@v4
        with:
          name: snack-preview
          path: SNACK_PREVIEW.json
