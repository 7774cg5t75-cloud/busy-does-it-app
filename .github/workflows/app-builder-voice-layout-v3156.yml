name: V3.156 Shared App Builder Layout and Safe Voice
on:
  push:
    branches: [v3.156]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Validate new and previous safe Business App flows
        run: |
          node scripts/check-app-voice-layout-v3156.mjs
          node scripts/check-native-public-booking-v3155.mjs
          node scripts/check-app-context-editor-v3155.mjs
          node scripts/check-standalone-native-v3154.mjs
          node scripts/check-app-appearance-v3154.mjs
          node scripts/check-app-builder-dual-track-v3153.mjs
          node scripts/check-production.mjs
      - name: Install Expo and syntax validation dependencies
        run: npm install --no-audit --no-fund
      - name: Parse TypeScript services and React Native app screens
        run: |
          node scripts/check-app-native-syntax-v3154.mjs
          node scripts/check-app-voice-layout-v3156.mjs
      - name: Prepare separate native prototype
        run: node scripts/prepare-standalone-prototype-v3154.mjs
      - name: Export standalone customer app JavaScript for iOS and Android
        run: |
          cd .tmp/standalone-prototype-v3154
          ../../node_modules/.bin/expo export --platform ios --output-dir /tmp/bdi-v3156-customer-ios
          ../../node_modules/.bin/expo export --platform android --output-dir /tmp/bdi-v3156-customer-android
      - name: Export Busy iOS and Android JavaScript bundles
        run: |
          npx expo export --platform ios --output-dir /tmp/bdi-v3156-busy-ios
          npx expo export --platform android --output-dir /tmp/bdi-v3156-busy-android
      - name: Guard against unapproved changes
        run: echo "No migration applied, AI voice provider enabled, payment, marketplace publishing or signed store app submitted."
