name: Apply v1.3 sweep

on:
  push:
    branches:
      - v1.3
    paths:
      - .github/workflows/apply-v13.yml
      - scripts/apply-v1.3.mjs
  workflow_dispatch:
    inputs:
      approval_phrase:
        description: "Explicit approval for this legacy external/source operation"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apply-v13
  cancel-in-progress: true

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.approval_phrase == 'APPROVE_LEGACY_SOURCE_SWEEP'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out v1.3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified upstream commit
        with:
          ref: v1.3

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 verified upstream commit
        with:
          node-version: 20

      - name: Apply v1.3 code sweep
        run: node scripts/apply-v1.3.mjs

      - name: Commit v1.3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add BusyDoesItApp.js package.json README.md
          if git diff --cached --quiet; then
            echo "No v1.3 changes to commit"
          else
            git commit -m "v1.3 job photos and reusable assets"
            git push
          fi
