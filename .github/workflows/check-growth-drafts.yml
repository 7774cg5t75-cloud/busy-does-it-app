name: V3.63 coordinated editable growth checks
on:
  push:
    branches: [v3.63, codex/builder-mission15-design-advancement]
    paths:
      - 'supabase/functions/busy-builder-proposals/creativeDocument*.mjs'
      - 'supabase/functions/busy-builder-proposals/creativeExecution*.mjs'
      - 'supabase/functions/busy-creative-document-pilot/**'
      - 'src/core/websiteDesignIntelligence.mjs'
      - 'supabase/functions/busy-website-worker/websiteCreativeSpecification.mjs'
      - 'src/core/websiteCreativeDocumentReview.mjs'
      - 'supabase/functions/busy-website-worker/websiteCreativeDocument.mjs'
      - 'supabase/functions/busy-website-worker/websiteCreativeDocumentRendering.mjs'
      - 'src/core/websiteStandaloneArchive.mjs'
  pull_request:
    paths:
      - "src/core/connectedEditorContinuation.mjs"
      - "src/components/ConnectedBusinessPreparation.js"
      - "src/core/photoPurposeAccount.mjs"
      - "src/core/browserBusinessPhotoProcessor.mjs"
      - "src/core/websiteExcellenceQuality.mjs"
      - "src/core/premiumWebsiteGoal.mjs"
      - "scripts/check-business-introduction.mjs"
      - "scripts/process-business-photo-fixtures.mjs"
      - "src/domain/coordinatedGrowthDrafts.mjs"
      - "src/domain/coordinatedGrowthPlan.mjs"
      - "src/domain/websiteBuilder.js"
      - "src/screens/businessCreationJourney.js"
      - "scripts/check-growth-drafts.mjs"
      - ".github/workflows/check-growth-drafts.yml"
  workflow_dispatch:
jobs:
  review-drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check approved-only growth planning
        run: node scripts/check-coordinated-growth.mjs
      - name: Check editable draft pack and handoff boundaries
        run: node scripts/check-growth-drafts.mjs
      - name: Check conversation and approval regressions
        run: node scripts/check-conversation-understanding.mjs
