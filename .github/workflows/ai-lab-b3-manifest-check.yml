name: AI Lab B3 manifest identity check only
on:
  push:
    branches: [codex/builder-mission15-design-advancement]
    paths: ['.github/workflows/ai-lab-b3-manifest-check.yml']
permissions: {}
concurrency:
  group: busy-ai-lab-b3-manifest-check
  cancel-in-progress: false
jobs:
  verify-manifest-only:
    if: >-
      ${{ github.event_name == 'push' &&
          github.repository == '7774cg5t75-cloud/busy-does-it-app' &&
          github.ref == 'refs/heads/codex/builder-mission15-design-advancement' &&
          github.event.before == 'e6e239592a82ac8fa6f337c8684b6acb4cb5caa9' &&
          github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment: busy-ai-lab-b3-source
    steps:
      - name: Check stored manifest identity only
        env:
          PRIVATE_MANIFEST: ${{ secrets.BUSY_AI_LAB_B3_MANIFEST_JSON }}
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          python3 -I - <<'PY_CHECK'
          import hashlib, json, os
          EXPECTED = '3409c7d6f6d4850e0a9cb4c586aca3c89623c0b0f2580de358511d0bc0a403c3'
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError()
                  result[key] = value
              return result
          def invalid_constant(value):
              raise ValueError()
          try:
              raw = os.environ.pop('PRIVATE_MANIFEST', '')
              if not raw or len(raw.encode('utf-8')) > 47000:
                  raise ValueError()
              value = json.loads(raw, object_pairs_hook=unique, parse_constant=invalid_constant)
              if type(value) is not dict:
                  raise ValueError()
              canonical = json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False).encode('utf-8')
              if hashlib.sha256(canonical).hexdigest() != EXPECTED:
                  raise ValueError()
          except BaseException:
              raise SystemExit('Manifest identity check refused; no private values logged.') from None
          print('BUSY_B3_MANIFEST_CHECK PASS ' + EXPECTED)
          PY_CHECK
