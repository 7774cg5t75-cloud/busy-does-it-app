name: Check BUSY AI backends

on:
  push:
    branches:
      - v3.5
    paths:
      - 'supabase/functions/busy-ai-intake/**'
      - 'supabase/functions/busy-social-content/**'
      - 'supabase/functions/busy-social-publish/**'
      - 'supabase/config.toml'
      - '.github/workflows/check-ai-intake.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check BUSY AI Edge Functions
        run: |
          deno check supabase/functions/busy-ai-intake/index.ts
          deno check supabase/functions/busy-social-content/index.ts
          deno check supabase/functions/busy-social-publish/index.ts
