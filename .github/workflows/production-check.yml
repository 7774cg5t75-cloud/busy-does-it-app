name: Production foundation check

on:
  push:
    branches:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  production-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Validate production foundation
        run: node scripts/check-production.mjs

      - name: Verify Expo Snack module dependency graph
        run: node scripts/check-snack-dependencies.mjs

      - name: Simulate website scale and failure recovery
        run: node scripts/website-platform-simulation.mjs
