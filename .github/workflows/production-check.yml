name: Production foundation check

on:
  push:
    branches:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  production-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Validate production foundation
        run: node scripts/check-production.mjs

      - name: Verify founder alerts and incident security regressions
        run: |
          node scripts/check-founder-operations.mjs
          node scripts/check-platform-autopilot.mjs
          node scripts/check-platform-autopilot-v371.mjs
          node scripts/check-platform-autopilot-v372.mjs
          node scripts/check-platform-autopilot-v373.mjs
          node scripts/check-platform-autopilot-v374.mjs
          node scripts/check-platform-autopilot-v375.mjs
          node scripts/check-platform-autopilot-v376.mjs
          node scripts/check-website-go-live-v377.mjs
          node scripts/check-customer-success-v378.mjs
          node scripts/check-customer-success-v379.mjs
          node scripts/check-headquarters-v380.mjs
          node scripts/check-founder-operations-v381.mjs
          node scripts/check-financial-autopilot-v382.mjs
          node scripts/check-dark-home-v383.mjs
          node scripts/check-unified-dark-v384.mjs
          node scripts/check-plain-language-v385.mjs
          node scripts/check-calendar-first-work-v386.mjs
          node scripts/check-social-simplification-v387.mjs
          node scripts/check-direct-create-post-v388.mjs
          node scripts/check-direct-home-post-v388.mjs
          node scripts/check-connected-accounts-v389.mjs
          node scripts/check-voice-v390.mjs
          node scripts/check-voice-upload-v391.mjs
          node scripts/check-talk-simplification-v392.mjs
          node scripts/check-website-proof-v393.mjs
          node scripts/check-website-simplicity-v394.mjs
          node scripts/check-hosted-website-preview-v395.mjs
          node scripts/check-website-brief-guide-v396.mjs
          node scripts/check-repeat-hosted-preview-v397.mjs
          node scripts/check-website-quality-v398.mjs
          node scripts/check-professional-websites-v399.mjs
          node scripts/check-intelligent-website-design-v3100.mjs
          node scripts/check-distinct-website-designs-v3101.mjs
          node scripts/check-website-edit-freedom-v3102.mjs
          node scripts/check-visual-critic-contract-v3102.mjs
          node scripts/check-real-website-vision-v3103.mjs
          node scripts/check-website-review-cycle-v3104.mjs
          node scripts/check-visual-review-gateway-v3105.mjs
          node scripts/check-website-visual-improvements-v3106.mjs
          node scripts/check-website-accessibility-contract-v3107.mjs
          node scripts/check-website-readability-and-domains-v3108.mjs
          node scripts/check-website-journey-v3109.mjs

      - name: Verify first-render Autopilot and inbox initialization
        run: node scripts/check-app-first-render.mjs

      - name: Verify Expo Snack module dependency graph
        run: node scripts/check-snack-dependencies.mjs

      - name: Simulate website scale and failure recovery
        run: node scripts/website-platform-simulation.mjs
