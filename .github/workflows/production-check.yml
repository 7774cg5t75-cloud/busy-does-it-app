name: Production foundation check

on:
  push:
    branches:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Validate production foundation
        run: node scripts/check-production.mjs

      - name: Verify founder alerts and incident security regressions
        run: |
          node scripts/check-founder-operations.mjs
          node scripts/check-platform-autopilot.mjs
          node scripts/check-platform-autopilot-v371.mjs
          node scripts/check-platform-autopilot-v372.mjs
          node scripts/check-platform-autopilot-v373.mjs
          node scripts/check-platform-autopilot-v374.mjs
          node scripts/check-platform-autopilot-v375.mjs
          node scripts/check-platform-autopilot-v376.mjs
          node scripts/check-website-go-live-v377.mjs
          node scripts/check-customer-success-v378.mjs
          node scripts/check-customer-success-v379.mjs
          node scripts/check-headquarters-v380.mjs
          node scripts/check-founder-operations-v381.mjs
          node scripts/check-financial-autopilot-v382.mjs
