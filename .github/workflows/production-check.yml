          node scripts/check-social-simplification-v387.mjs
          node scripts/check-direct-create-post-v388.mjs
          node scripts/check-direct-home-post-v388.mjs
          node scripts/check-connected-accounts-v389.mjs
          node scripts/check-voice-v390.mjs
          node scripts/check-voice-upload-v391.mjs
          node scripts/check-talk-simplification-v392.mjs
          node scripts/check-website-proof-v393.mjs
          node scripts/check-website-simplicity-v394.mjs
          node scripts/check-hosted-website-preview-v395.mjs
          node scripts/check-website-brief-guide-v396.mjs
          node scripts/check-repeat-hosted-preview-v397.mjs
          node scripts/check-website-quality-v398.mjs
          node scripts/check-professional-websites-v399.mjs
